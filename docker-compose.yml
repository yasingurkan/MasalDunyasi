services:
  db:
    image: postgres:16-alpine
    container_name: masaldunyasi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: masaldunyasi
      POSTGRES_USER: masaluser
      POSTGRES_PASSWORD: masalpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masaluser -d masaldunyasi"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masaldunyasi-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://masaluser:masalpass123@db:5432/masaldunyasi
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/docker-entrypoint.sh"]

volumes:
  postgres_data:
